<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёпа Созвон</title>
    <link rel="manifest" href="./manifest.json">
    <style type="text/css">
    	.tepka {
    		width: 200px;
    		border-radius: 10px;
    		margin-top: 25vh;
    		animation: tepa 1s linear infinite;
    	}
    	@keyframes tepa {
    		100% {
    			rotate: 360deg;
    		}
    	}
    	.main {
    		display: flex;
    		justify-content: center;
    	}
    	h1 {
    		position: absolute;
    		background-color: black;
    		color: cyan;
    		border-radius: 10px;
    		padding: 10px;
    	}
    	body {
    		background-color: skyblue;
    	}
    </style>
    <link rel="shortcut icon" href="./images/Tépa.ico" type="image/x-icon">
</head>
<body>
	<div class="main">
		<h1>Хачу Пельмени</h1>
		<img src="./images/Tépa.png" alt="Tepa" class="tepka">
	</div>
	<script type="text/javascript">
		const muy = new Audio('./sounds/mc_cat-meow.mp3');
		muy.volume = 1.0;
		muy.play();
	</script>
</body>
</html>
